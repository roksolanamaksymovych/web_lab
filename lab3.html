<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfume Store</title>
    <link rel="stylesheet" href="./lab3_style.css"/>

</head>
<body>
    <h1>Perfume Store</h1>

    <div>
        <h2>Sort and Search Options</h2>
        <button id="sortPrice">Sort by Price</button>
        <button id="sortVolume">Sort by Volume</button>

        <div>
            <input type="text" id="searchInput" placeholder="Search by Brand">
            <button id="searchButton">Search</button>
            <button id="resetButton">Reset</button>
        </div>
    </div>

    <h2>Perfumes:</h2>
    <table>
        <thead>
            <tr>
                <th>Brand</th>
                <th>Volume</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody id="perfumesList"></tbody>
    </table>

    <div>
        <button id="calculateButton">Calculate Total Price</button>
        <h2>Total Price: <span id="totalPrice">0</span> грн</h2>
    </div>

    <script src="/lab3/lab3.js"></script>
</body>
</html>
